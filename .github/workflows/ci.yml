name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: python scripts/check_openapi_drift.py

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: docker compose -f tests/integration/docker-compose.yml up -d
      - run: LISTMONK_INTEGRATION=1 pytest -m integration --no-cov
      - if: always()
        run: docker compose -f tests/integration/docker-compose.yml down -v
