[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "listmonk-mcp"
version = "0.5.0"
description = "An explicit, safety-gated MCP interface for the Listmonk API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=2,<3",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "pyyaml>=6,<7",
]

[project.scripts]
listmonk-mcp = "listmonk_mcp.server:main"

[tool.pytest.ini_options]
addopts = "-q --cov=listmonk_mcp --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: requires the pinned Listmonk Docker stack",
]

[tool.coverage.run]
source = ["listmonk_mcp"]

[tool.coverage.report]
fail_under = 100
show_missing = true
